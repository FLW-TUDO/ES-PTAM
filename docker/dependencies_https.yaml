# HTTPS version of dependencies.yaml – safe for use inside Docker builds
# (no SSH keys required). SSH → HTTPS conversions:
#   git@github.com:uzh-rpg/cnpy_catkin.git          → https://github.com/uzh-rpg/cnpy_catkin.git
#   git@github.com:zurich-eye/cmake_external_project_catkin.git → https://github.com/zurich-eye/cmake_external_project_catkin.git
#   git@github.com:ethz-asl/minkindr_ros.git        → https://github.com/ethz-asl/minkindr_ros.git
repositories:
  catkin_simple:
    type: git
    url: https://github.com/catkin/catkin_simple.git
    version: master
  rpg_dvs_ros:
    type: git
    url: https://github.com/uzh-rpg/rpg_dvs_ros.git
    version: master
  gflags_catkin:
    type: git
    url: https://github.com/ethz-asl/gflags_catkin.git
    version: master
  glog_catkin:
    type: git
    url: https://github.com/ethz-asl/glog_catkin.git
    version: master
  minkindr:
    type: git
    url: https://github.com/ethz-asl/minkindr.git
    version: master
  eigen_catkin:
    type: git
    url: https://github.com/ethz-asl/eigen_catkin.git
    version: master
  eigen_checks:
    type: git
    url: https://github.com/ethz-asl/eigen_checks.git
    version: master
  cnpy:
    type: git
    url: https://github.com/uzh-rpg/cnpy_catkin.git
    version: master
  # vicon is replaced by docker/stub_packages/vicon (ARM64-safe stub that
  # provides vicon/Subject.h without the x86_64-only precompiled SDK).
  cmake_external_project_catkin:
    type: git
    url: https://github.com/zurich-eye/cmake_external_project_catkin.git
    version: master
  minkindr_ros:
    type: git
    url: https://github.com/ethz-asl/minkindr_ros.git
    version: master
